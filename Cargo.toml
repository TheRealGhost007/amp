[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/player-core",
    "crates/audio-engine",
    "crates/linux-integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["trg"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1"
lofty = "0.25"
gstreamer = { version = "0.25", features = ["v1_28"] }

player-core = { path = "crates/player-core" }
audio-engine = { path = "crates/audio-engine" }
linux-integration = { path = "crates/linux-integration" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
